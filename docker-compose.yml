services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://desk:desk@db:5432/desk
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as the API, different command. Scale with `docker compose up --scale worker=3`;
  # SKIP LOCKED keeps the copies from taking the same job.
  worker:
    build: .
    # Skips docker/entrypoint.sh: the api service runs migrations, the worker only chunks.
    entrypoint: ["python", "-m", "app.ingestion.worker"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://desk:desk@db:5432/desk
      OLLAMA_URL: http://ollama:11434
      LOG_JSON: "true"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    # On first start the api may still be migrating; if the worker starts first and
    # its query fails on a missing table, it exits and Docker restarts it.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      # Waits for the model download to finish, so the first jobs do not fail with
      # "model not found".
      ollama-pull:
        condition: service_completed_successfully

  # Serves the open-source embedding model over HTTP. Pinned like the other images so
  # an upgrade is a deliberate change. CPU only; see Ollama's docs to add a GPU.
  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Downloaded models live here, so they survive container restarts.
      - ollamamodels:/root/.ollama

  # One-off job: download the embedding model into the ollama service, then exit.
  # Instant after the first time, because the model is already in the volume.
  ollama-pull:
    image: ollama/ollama:0.5.7
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  db:
    # Postgres 16 with the pgvector extension, which stores the chunk embeddings.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  ollamamodels:
